# =============================================================================
# User states (year-based)
# -----------------------------------------------------------------------------
# The right-hand card is a *state*. As the user scrolls the timeline, the year
# of the entry currently in view selects one of the states below.
#
# Stickers are NOT written here — they are derived automatically from the
# timeline content (main-timeline.yaml) for that year:
#   Education                  -> Student
#   Education (completed)      -> Graduate
#   Organization               -> Employee
#   Research Publication       -> Researcher
#   International Conference   -> Researcher
#   ongoing entry              -> Active
# =============================================================================
