  name: Debasish Mohanty
  image: ./assets/icons/user_image_placeholder.jpg
  tagline: Weaving worlds through code and creativity.
  contacts:
    - label: email
      value: availdebasish@gmail.com
      url: mailto:availdebasish@gmail.com
    - label: github
      value: TRY-ER
      url: https://github.com/TRY-ER

states:
  - year: 2022
    label: Graduate Student
    description: Completing an M.(Sc).Tech in Material Science, specialising in organic molecules and photovoltaics.
    image: ./assets/icons/user_image_placeholder.jpg

  - year: 2023
    label: Research Intern
    description: Research intern at CIPET LARPM and AIC-NITF, publishing ML work on perovskite solar cells.
    image: ./assets/icons/user_image_placeholder.jpg

